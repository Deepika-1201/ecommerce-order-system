name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      # v5, not v6: v6 bundles a proprietary caching component under separate terms of use.
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and test
        run: ./gradlew --no-daemon build
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests

  container:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack (PostgreSQL, Keycloak, S3Proxy, the app)
        run: docker compose up --build --detach
      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS localhost:8081/actuator/health/readiness; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Check the roles and the error model
        run: |
          curl -fsS localhost:8081/actuator/info | grep -q '"roles":\["api","worker"\]'
          curl -sS localhost:8080/v1/nothing-here | grep -q '"code":"unauthorized"'
      - name: Wait for Keycloak
        run: |
          for attempt in $(seq 1 90); do
            if curl -fsS -o /dev/null localhost:8180/realms/ecommerce/.well-known/openid-configuration; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Phase 3 demo (tokens, catalog, image upload, browsing, addresses)
        run: scripts/demo-catalog.sh
      - name: Phase 4 demo (guest cart, merge at sign-in, quotes with GST, owner-only access)
        run: scripts/demo-cart.sh
      - name: Show logs
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down --volumes
