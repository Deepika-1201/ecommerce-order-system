name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      # v5, not v6: v6 bundles a proprietary caching component under separate terms of use.
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and test
        run: ./gradlew --no-daemon build
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests

  container:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack (PostgreSQL, Keycloak, S3Proxy, the app)
        run: docker compose up --build --detach
      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS localhost:8081/actuator/health/readiness; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Check the roles and the error model
        run: |
          curl -fsS localhost:8081/actuator/info | grep -q '"roles":\["api","worker"\]'
          curl -sS localhost:8080/v1/nothing-here | grep -q '"code":"unauthorized"'
      - name: Wait for Keycloak
        run: |
          for attempt in $(seq 1 90); do
            if curl -fsS -o /dev/null localhost:8180/realms/ecommerce/.well-known/openid-configuration; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Phase 3 demo (tokens, catalog, image upload, browsing, addresses)
        run: scripts/demo-catalog.sh
      - name: Phase 4 demo (guest cart, merge at sign-in, quotes with GST, owner-only access)
        run: scripts/demo-cart.sh
      - name: Phase 5 demo (receipts and adjustments with Idempotency-Key, movements, warehouse-only access)
        run: scripts/demo-inventory.sh
      - name: Phase 6 demo (placement with Idempotency-Key, the order process, cancellation, rejection)
        run: scripts/demo-orders.sh
      - name: Show logs
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down --volumes

  # The same stack with the real Payment Gateway, built at its pinned commit (LLD §7.11, §7.15).
  ecosystem:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ecosystem.yml
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack with the Payment Gateway, and onboard this system as its merchant
        run: docker compose up --build --detach
      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 90); do
            if curl -fsS localhost:8081/actuator/health/readiness; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Check that payments go to the gateway, not the fake
        run: docker compose logs app | grep -q "Payments use the gateway at http://payment-gateway:8090"
      - name: Wait for Keycloak
        run: |
          for attempt in $(seq 1 90); do
            if curl -fsS -o /dev/null localhost:8180/realms/ecommerce/.well-known/openid-configuration; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Phase 6 demo against the gateway (an unpaid payment cancelled there)
        run: scripts/demo-orders.sh
      - name: Phase 7 demo (hosted checkout, webhooks, refunds; the PSP's timeout, silence and decline)
        run: scripts/demo-payments.sh
      - name: Phase 8 demo (packed, handed over and delivered; scans out of order; return to origin; carrier outage)
        run: scripts/demo-fulfillment.sh
      - name: Show logs
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down --volumes
