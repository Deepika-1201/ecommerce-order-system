services:
  postgres:
    mem_limit: 384m

  keycloak:
    mem_limit: 768m

  s3proxy:
    mem_limit: 256m
    environment:
      JAVA_TOOL_OPTIONS: -Xmx128m

  kafka-storage:
    image: apache/kafka:4.3.1
    user: "0:0"
    entrypoint: ["sh", "-c", "chown 1000:1000 /data"]
    volumes:
      - kafka-data:/data

  kafka:
    image: apache/kafka:4.3.1
    mem_limit: 640m
    depends_on:
      kafka-storage:
        condition: service_completed_successfully
    environment:
      CLUSTER_ID: 9luoXyYETZWNVFmWTuKthA
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
      KAFKA_LOG_CLEANER_DEDUPE_BUFFER_SIZE: 16777216
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.31.5
    mem_limit: 80m
    environment:
      MP_MAX_MESSAGES: 1000
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    mem_limit: 768m
    environment:
      ECOM_EVENTS_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SMTP_HOST: mailpit
    depends_on:
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health/readiness HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 60

volumes:
  kafka-data: