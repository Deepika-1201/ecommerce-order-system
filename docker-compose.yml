# Local development only: the credentials below are not secrets. Later phases add the services they use (LLD §1.9).
name: ecommerce-order-system

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ecommerce
      DB_USER: ecommerce
      DB_PASSWORD: ecommerce
      ECOM_ROLES: api,worker
    ports:
      - "8080:8080"
      - "8081:8081"

volumes:
  postgres-data:
