services:
  app:
    ports: !override
      - "8080:8080"
      - "127.0.0.1:8081:8081"

  prometheus:
    image: prom/prometheus:v3.15.0
    mem_limit: 256m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --storage.tsdb.retention.size=128MB
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:9090/-/ready]
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    image: grafana/grafana:13.2.4
    mem_limit: 512m
    environment:
      GOMEMLIMIT: 320MiB
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_DISABLE_PLUGINS: grafana-pyroscope-app,grafana-metricsdrilldown-app,grafana-exploretraces-app,grafana-advisor-app,grafana-lokiexplore-app
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ecommerce.json
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/ecommerce.json:/var/lib/grafana/dashboards/ecommerce.json:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:3000/api/health]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  prometheus-data:
  grafana-data: