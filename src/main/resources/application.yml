spring:
  application:
    name: ecommerce-order-system
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
    username: ${DB_USER:ecommerce}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 3000
      validation-timeout: 1000
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
      mail.smtp.starttls.required: ${SMTP_STARTTLS_REQUIRED:false}
  # Tokens are validated against ecom.security (LLD §3.2); keys are fetched from the JWK set, never by discovery.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ecom.security.issuer}
          jwk-set-uri: ${ecom.security.jwk-set-uri}
          audiences: ${ecom.security.audience}
  # The outbox relay is the only producer (LLD §2.5). Kafka is not a readiness dependency: the outbox buffers.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 5
        max.block.ms: 5000
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000

server:
  port: ${PORT:8080}

ecom:
  roles: ${ECOM_ROLES:api,worker}
  events:
    enabled: ${ECOM_EVENTS_ENABLED:false}
    partitions: ${ECOM_EVENTS_PARTITIONS:12}
    replication-factor: ${ECOM_EVENTS_REPLICATION_FACTOR:1}
    min-in-sync-replicas: ${ECOM_EVENTS_MIN_IN_SYNC_REPLICAS:1}
  security:
    issuer: ${ECOM_SECURITY_ISSUER:http://localhost:8180/realms/ecommerce}
    jwk-set-uri: ${ECOM_SECURITY_JWK_SET_URI:http://localhost:8180/realms/ecommerce/protocol/openid-connect/certs}
    audience: ${ECOM_SECURITY_AUDIENCE:ecommerce-api}
  # Without ECOM_MEDIA_ENDPOINT this is AWS S3 with the default credential chain (LLD §3.13).
  media:
    bucket: ${ECOM_MEDIA_BUCKET:ecommerce-media}
    region: ${ECOM_MEDIA_REGION:ap-south-1}
    public-base-url: ${ECOM_MEDIA_PUBLIC_BASE_URL:http://localhost:9000/ecommerce-media}
    object-acl: ${ECOM_MEDIA_OBJECT_ACL:public-read}

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 1ms
      maximum-expected-value:
        http.server.requests: 5s
  endpoints:
    web:
      exposure:
        include: health,info,openapi,prometheus
  endpoint:
    health:
      probes:
        add-additional-paths: true
      group:
        readiness:
          include: readinessState,db

logging:
  pattern:
    level: "%5p [request_id=%X{request_id:-} correlation_id=%X{correlation_id:-} message_id=%X{message_id:-} task_id=%X{task_id:-}]"

# The OpenAPI document, on the management port only (ADR-016); the committed copy is docs/api/openapi.json.
springdoc:
  # Deliberately on: served only on the management port, and /v3/api-docs is denied by default on both ports.
  api-docs:
    enabled: true
  use-management-port: true
  paths-to-match: /v1/**
  default-produces-media-type: application/json
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true
