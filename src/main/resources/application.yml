spring:
  application:
    name: ecommerce-order-system
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
    username: ${DB_USER:ecommerce}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 3000
      validation-timeout: 1000
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  # The outbox relay is the only producer (LLD §2.5). Kafka is not a readiness dependency: the outbox buffers.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 5
        max.block.ms: 5000
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000

server:
  port: ${PORT:8080}

ecom:
  roles: ${ECOM_ROLES:api,worker}

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        add-additional-paths: true
      group:
        readiness:
          include: readinessState,db

logging:
  pattern:
    level: "%5p [%X{request_id:-}]"
